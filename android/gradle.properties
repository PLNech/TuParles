org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# KSP 2.2 still registers generated sources through kotlin.sourceSets. AGP 9
# built-in Kotlin rejects that until KSP moves to android.sourceSets. Drop this
# line once a KSP release no longer needs it.
android.disallowKotlinSourceSets=false
